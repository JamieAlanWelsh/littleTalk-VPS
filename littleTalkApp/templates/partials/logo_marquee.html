{% load static %}
{% comment %} Marquee Section — include with optional cta_href / cta_label {% endcomment %}
<section class="logo-marquee" aria-label="Schools using Chatterdillo">
    <p class="logo-marquee-title">Join over 50 schools already using Chatterdillo</p>
    <div class="logo-marquee-track">
        <div class="logo-marquee-row">
            <div class="logo-marquee-set">
                <img src="{% static 'images/landing/school_logos/schoollogo1.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo2.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo3.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo4.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo5.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo6.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo7.webp' %}" alt="Partner school logo">
                <img src="{% static 'images/landing/school_logos/schoollogo8.webp' %}" alt="Partner school logo">
            </div>
            <div class="logo-marquee-set" aria-hidden="true">
                <img src="{% static 'images/landing/school_logos/schoollogo1.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo2.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo3.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo4.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo5.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo6.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo7.webp' %}" alt="">
                <img src="{% static 'images/landing/school_logos/schoollogo8.webp' %}" alt="">
            </div>
        </div>
    </div>
    {% if cta_href %}
    <a href="{{ cta_href }}" class="cta-button main-button logo-marquee-button">{{ cta_label }}</a>
    {% endif %}
</section>
